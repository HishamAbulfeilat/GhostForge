<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <title>GhostForge JARVIS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-hover: #1a1a26;
      --border: rgba(255,255,255,0.06);
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.15);
      --text: #e4e4e7;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .header .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
    }
    .header .title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
    .header .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .header .status {
      margin-left: auto; width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.4);
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%; padding: 12px 16px; border-radius: 16px;
      font-size: 15px; line-height: 1.5; word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user {
      align-self: flex-end; background: var(--accent); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.jarvis {
      align-self: flex-start; background: var(--surface);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }
    .msg.jarvis pre { background: var(--bg); padding: 8px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin-top: 8px; }
    .msg.jarvis code { font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; }
    .msg.system {
      align-self: center; font-size: 12px; color: var(--text-dim);
      padding: 4px 12px; background: transparent;
    }
    .input-area {
      padding: 12px 16px 24px; border-top: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .input-row textarea {
      flex: 1; resize: none; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; font-size: 15px;
      background: var(--bg); color: var(--text); font-family: inherit;
      outline: none; min-height: 44px; max-height: 120px;
      transition: border-color 0.2s;
    }
    .input-row textarea:focus { border-color: var(--accent); }
    .input-row textarea::placeholder { color: var(--text-dim); }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      border: none; border-radius: 10px; padding: 10px 16px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .btn-primary { background: var(--accent); color: #fff; flex: 1; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-voice {
      background: var(--surface-hover); color: var(--text);
      border: 1px solid var(--border); width: 44px; height: 44px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      padding: 0; flex: 0 0 44px;
    }
    .btn-voice.listening { background: var(--danger); color: #fff; border-color: var(--danger); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }
    .quick-actions {
      display: flex; gap: 8px; overflow-x: auto; padding: 0 0 8px;
      scrollbar-width: none;
    }
    .quick-actions::-webkit-scrollbar { display: none; }
    .quick-btn {
      flex-shrink: 0; border: 1px solid var(--border); border-radius: 20px;
      padding: 6px 14px; font-size: 13px; color: var(--text-muted);
      background: transparent; cursor: pointer; transition: all 0.15s;
    }
    .quick-btn:active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }
    .typing { display: flex; gap: 4px; padding: 4px 0; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">GF</div>
    <div>
      <div class="title">JARVIS</div>
      <div class="subtitle">GhostForge AI Assistant</div>
    </div>
    <div class="status"></div>
  </div>

  <div class="messages" id="messages">
    <div class="msg system">Connected to GhostForge JARVIS</div>
    <div class="msg jarvis">
      Hello! I'm JARVIS, your GhostForge AI assistant. I can help with code, debugging, architecture decisions, and more. How can I help?
    </div>
  </div>

  <div class="input-area">
    <div class="quick-actions">
      <button class="quick-btn" onclick="quickSend('Explain this code')">Explain code</button>
      <button class="quick-btn" onclick="quickSend('Find and fix the bug')">Fix bug</button>
      <button class="quick-btn" onclick="quickSend('Write tests for this')">Write tests</button>
      <button class="quick-btn" onclick="quickSend('Review my code')">Code review</button>
      <button class="quick-btn" onclick="quickSend('Optimize performance')">Optimize</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Ask JARVIS anything..." oninput="autoResize(this)"></textarea>
      <button class="btn btn-voice" id="voiceBtn" onclick="toggleVoice()">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
      </button>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const voiceBtn = document.getElementById('voiceBtn');
    let isListening = false;
    let recognition = null;

    const QUICK_REPLIES = {
      'Explain this code': 'Please share the code you want me to explain, and I\'ll break it down for you.',
      'Find and fix the bug': 'Describe the bug or paste the error output, and I\'ll help you fix it.',
      'Write tests for this': 'Share the code you want tested, and I\'ll write comprehensive tests for it.',
      'Review my code': 'Paste your code and I\'ll do a thorough review covering correctness, performance, and style.',
      'Optimize performance': 'Share the code or describe the bottleneck, and I\'ll suggest optimizations.'
    };

    function quickSend(text) {
      input.value = text;
      autoResize(input);
      sendMessage();
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg jarvis';
      div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = 'auto';
      addMessage(text, 'user');
      const typing = showTyping();

      setTimeout(() => {
        typing.remove();
        if (QUICK_REPLIES[text]) {
          addMessage(QUICK_REPLIES[text], 'jarvis');
        } else {
          addMessage('I received your message: "' + text + '". For the full JARVIS experience with code execution, screen capture, and memory, use the desktop app or connect to your GhostForge server.', 'jarvis');
        }
      }, 800 + Math.random() * 1200);
    }

    function toggleVoice() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        addMessage('Speech recognition is not available on this device.', 'system');
        return;
      }
      if (isListening) { stopVoice(); return; }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        input.value = transcript;
        autoResize(input);
      };
      recognition.onend = () => { isListening = false; voiceBtn.classList.remove('listening'); };
      recognition.onerror = () => { isListening = false; voiceBtn.classList.remove('listening'); };
      recognition.start();
      isListening = true;
      voiceBtn.classList.add('listening');
    }

    function stopVoice() {
      if (recognition) recognition.stop();
      isListening = false;
      voiceBtn.classList.remove('listening');
    }
  </script>
</body>
</html>
