appId: com.ghostforge.jarvis
productName: GhostForge JARVIS
copyright: Copyright © 2024 GhostForge

directories:
  output: release

files:
  - dist/**/*

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  arch:
    - x64
    - arm64
  extendInfo:
    NSMicrophoneUsageDescription: GhostForge JARVIS needs microphone access for voice commands
    NSScreenCaptureUsageDescription: GhostForge JARVIS captures your screen to understand context
    NSSpeechRecognitionUsageDescription: GhostForge JARVIS uses speech recognition for voice commands
    NSCameraUsageDescription: GhostForge JARVIS uses your camera for visual input

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  arch:
    - x64

linux:
  icon: build/icons
  category: Development
  target:
    - AppImage
    - deb
    - rpm
    - snap
  arch:
    - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GhostForge JARVIS

appImage:
  license: LICENSE

snap:
  confinement: strict
  grade: stable
  plugins:
    - network
    - audio-record
