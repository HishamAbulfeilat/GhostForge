appId: com.ghostforge.jarvis
productName: GhostForge JARVIS
copyright: Copyright © 2024 GhostForge

directories:
  output: release

files:
  - dist/**/*
  - android-web/**/*

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  afterSign: scripts/notarize.js
  extendInfo:
    NSMicrophoneUsageDescription: GhostForge JARVIS needs microphone access for voice commands
    NSScreenCaptureUsageDescription: GhostForge JARVIS captures your screen to understand context
    NSSpeechRecognitionUsageDescription: GhostForge JARVIS uses speech recognition for voice commands
    NSCameraUsageDescription: GhostForge JARVIS uses your camera for visual input

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable

linux:
  icon: build/icons
  category: Development
  target:
    - AppImage
    - deb
    - rpm
    - snap

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GhostForge JARVIS
  customNsisBinary: build/windows-installer.nsh

appImage:
  license: LICENSE

snap:
  confinement: strict
  grade: stable
  plugs:
    - network
    - audio-record
    - screen-capture
    - camera
    - desktop

extraResources:
  - from: bridge/
    to: bridge/
    filter:
      - "**/*"
