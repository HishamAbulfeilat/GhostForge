name: Mirror to GhostForge

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to HishamAbulfeilat/GhostForge
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          CLEAN_TOKEN=$(echo "$MIRROR_TOKEN" | tr -d '[:space:]')
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "⚠️ MIRROR_TOKEN secret not set — skipping."
            exit 0
          fi
          # Verify token works (read access)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${CLEAN_TOKEN}" \
            "https://api.github.com/repos/HishamAbulfeilat/GhostForge")
          echo "API access check: $HTTP_CODE"
          # Verify token identity
          curl -s -H "Authorization: Bearer ${CLEAN_TOKEN}" \
            "https://api.github.com/user" | grep -E '"login"|"type"'
          git config --global credential.helper store
          echo "https://x-access-token:${CLEAN_TOKEN}@github.com" > ~/.git-credentials
          git remote add mirror https://github.com/HishamAbulfeilat/GhostForge.git
          git push mirror --mirror
