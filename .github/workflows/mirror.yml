name: Mirror to GhostForge

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to HishamAbulfeilat/GhostForge
        run: |
          if [ -z "${{ secrets.MIRROR_TOKEN }}" ]; then
            echo "⚠️ MIRROR_TOKEN secret not set — skipping mirror push."
            echo "Add a PAT from HishamAbulfeilat account with repo scope as MIRROR_TOKEN secret."
            exit 0
          fi
          git remote add mirror https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/HishamAbulfeilat/GhostForge.git
          git push mirror --mirror
