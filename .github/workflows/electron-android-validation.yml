name: Electron + Android CI Validation

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            build: npx electron-builder --win nsis portable --x64 --publish never
          - name: linux
            os: ubuntu-latest
            build: npx electron-builder --linux AppImage deb rpm --x64 --publish never
          - name: macos
            os: macos-latest
            build: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
    defaults:
      run:
        working-directory: electron-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install Electron dependencies
        run: npm ci

      - name: Prepare Linux packaging prerequisites
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Generate Electron icons
        run: node scripts/generate-icons.js

      - name: Type-check Electron app
        run: npx tsc

      - name: Run headless Electron smoke test
        env:
          GHOSTFORGE_ELECTRON_HEADLESS_SMOKE: '1'
        run: >-
          if [ "${{ matrix.name }}" = "linux" ]; then xvfb-run -a node --test test/headless-launch-smoke.test.mjs; else node --test test/headless-launch-smoke.test.mjs; fi
        shell: bash

      - name: Package Electron app
        run: ${{ matrix.build }}

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: electron-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Electron dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: bash scripts/build-android.sh debug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostforge-android-debug-apk
          path: electron-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
