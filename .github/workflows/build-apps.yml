name: Build Apps

# Builds GhostForge JARVIS for every platform. Artifacts are attached to each
# run; pushing a `v*` tag also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            build: npx electron-builder --win nsis portable --x64 --publish never
            files: |
              electron-app/release/*.exe
          - name: linux
            os: ubuntu-latest
            build: npx electron-builder --linux AppImage deb rpm --x64 --publish never
            files: |
              electron-app/release/*.AppImage
              electron-app/release/*.deb
              electron-app/release/*.rpm
          - name: macos
            os: macos-latest
            build: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
            files: |
              electron-app/release/*.dmg
              electron-app/release/*-mac.zip
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: node scripts/generate-icons.js
      - run: npx tsc
      - run: ${{ matrix.build }}
        env:
          # Unsigned builds unless signing secrets are configured
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ghostforge-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      # electron-app/android/ is gitignored — generate it when absent
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: ./gradlew assembleDebug assembleRelease bundleRelease
        working-directory: electron-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: ghostforge-android
          path: |
            electron-app/android/app/build/outputs/apk/debug/*.apk
            electron-app/android/app/build/outputs/apk/release/*.apk
            electron-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      # Unsigned simulator build. A device .ipa needs an Apple signing
      # certificate + provisioning profile configured as repository secrets.
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          cd build/ios/Build/Products/Release-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/electron-app/GhostForge-JARVIS-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ghostforge-ios
          path: electron-app/GhostForge-JARVIS-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
