name: Build Apps

# Builds GhostForge JARVIS for every platform. Release APK/AAB artifacts are kept
# here for signed release builds; the debug APK for PR validation is built in the
# Android validation workflow and downloaded from the run's Artifacts page.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            build: npx electron-builder --win nsis portable --x64 --publish never
            files: |
              electron-app/release/*.exe
          - name: linux
            os: ubuntu-latest
            build: npx electron-builder --linux AppImage deb rpm --x64 --publish never
            files: |
              electron-app/release/*.AppImage
              electron-app/release/*.deb
              electron-app/release/*.rpm
          - name: macos
            os: macos-latest
            build: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
            files: |
              electron-app/release/*.dmg
              electron-app/release/*-mac.zip
    defaults:
      run:
        working-directory: electron-app
    # Only Windows/macOS can be signed, and only when a certificate secret exists.
    # An empty CSC_LINK makes electron-builder try to resolve "" as a path and
    # fail ("Env WIN_CSC_LINK is not correct … not a file"), so the build is split
    # into signed / unsigned steps and CSC_LINK is simply never set when unsigned.
    env:
      HAS_CSC: ${{ (matrix.name == 'windows' && secrets.WIN_CSC_LINK != '') || (matrix.name == 'macos' && secrets.MAC_CSC_LINK != '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: node scripts/generate-icons.js
      - run: npx tsc
      - name: Build desktop (signed)
        if: env.HAS_CSC == 'true'
        run: ${{ matrix.build }}
        env:
          # Windows (.pfx) and macOS (.p12) need different certificates (see docs/SIGNING.md)
          CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.name == 'macos' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build desktop (unsigned)
        if: env.HAS_CSC != 'true'
        run: ${{ matrix.build }}
        env:
          # No certificate: build unsigned. CSC_LINK is left unset so electron-builder
          # skips signing instead of trying to resolve an empty path.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ghostforge-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete "tools" package was removed from Google's SDK repo and
          # now 404s ("Failed to find package 'tools'"). Install only platform-tools;
          # the Android Gradle plugin fetches build-tools/platforms it needs.
          packages: platform-tools
      - run: npm ci
      - run: npx cap sync android
      # Release signing: base64 keystore in ANDROID_KEYSTORE_BASE64 (see docs/SIGNING.md)
      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore" && echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease bundleRelease
        working-directory: electron-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ghostforge-android
          path: |
            electron-app/android/app/build/outputs/apk/release/*.apk
            electron-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_ID != '' }}
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      # Unsigned simulator build. A device .ipa needs an Apple signing
      # certificate + provisioning profile configured as repository secrets.
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          cd build/ios/Build/Products/Release-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/electron-app/GhostForge-JARVIS-ios-simulator.zip" App.app
      # Signed device build (.ipa) when an App Store Connect API key is configured
      - name: Signed archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        if: env.HAS_ASC_KEY == 'true'
        run: |
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -archivePath build/ios/App.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic $AUTH archive
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" -c "Add :teamID string $APPLE_TEAM_ID" build/ios/export.plist
          xcodebuild -exportArchive -archivePath build/ios/App.xcarchive -exportOptionsPlist build/ios/export.plist \
            -exportPath build/ios/export $AUTH
          cp build/ios/export/*.ipa "$GITHUB_WORKSPACE/electron-app/"
      - uses: actions/upload-artifact@v4
        with:
          name: ghostforge-ios
          path: |
            electron-app/GhostForge-JARVIS-ios-simulator.zip
            electron-app/*.ipa
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
