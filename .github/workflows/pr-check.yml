name: PR Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-check:
    name: GhostForge PR Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f "bun.lockb" ]; then
            npm install -g bun && bun install
          elif [ -f "pnpm-lock.yaml" ]; then
            npm install -g pnpm && pnpm install
          elif [ -f "yarn.lock" ]; then
            yarn install
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            echo "No lockfile found, skipping install"
          fi

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: |
          if [ -f ".eslintrc*" ] || [ -f "eslint.config.*" ]; then
            npx eslint . --ext .ts,.tsx,.js,.jsx --format json --output-file /tmp/lint-results.json 2>/dev/null || true
            ERRORS=$(node -e "try{const r=require('/tmp/lint-results.json');const e=r.reduce((a,b)=>a+b.errorCount,0);const w=r.reduce((a,b)=>a+b.warningCount,0);console.log(e+' errors, '+w+' warnings');}catch{console.log('lint check failed')}" 2>/dev/null)
            echo "result=$ERRORS" >> $GITHUB_OUTPUT
          else
            echo "result=no eslint config" >> $GITHUB_OUTPUT
          fi

      - name: Check .env vs .env.example
        id: env-check
        continue-on-error: true
        run: |
          ISSUES=""
          if [ -f ".env.example" ]; then
            if [ -f ".env" ]; then
              MISSING=$(comm -23 <(grep -oP '^[A-Z_][A-Z0-9_]*(?==)' .env.example | sort) <(grep -oP '^[A-Z_][A-Z0-9_]*(?==)' .env | sort) 2>/dev/null | wc -l)
              echo "result=${MISSING} keys in .env.example not in .env" >> $GITHUB_OUTPUT
            else
              echo "result=no .env file" >> $GITHUB_OUTPUT
            fi
          else
            echo "result=no .env.example" >> $GITHUB_OUTPUT
          fi

      - name: Check for unused dependencies (knip)
        id: unused
        continue-on-error: true
        run: |
          if [ -f "package.json" ]; then
            RESULT=$(npx --yes knip --reporter compact 2>/dev/null | head -5 || echo "scan complete")
            echo "result<<EOF" >> $GITHUB_OUTPUT
            echo "$RESULT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: RTL check (Tailwind logical properties)
        id: rtl
        continue-on-error: true
        run: |
          COUNT=$(grep -rE '\b(ml|mr|pl|pr)-[0-9]|text-(left|right)\b' --include="*.tsx" --include="*.jsx" --include="*.ts" src/ 2>/dev/null | wc -l | tr -d ' ')
          echo "result=${COUNT} physical Tailwind classes found" >> $GITHUB_OUTPUT

      - name: React Doctor scan
        id: react-doctor
        continue-on-error: true
        run: |
          if [ -f "package.json" ] && grep -q '"react"' package.json; then
            SCORE=$(npx react-doctor@latest --score 2>/dev/null | grep -oP '\d+(?= / 100)' | head -1 || echo "?")
            echo "result=${SCORE}/100" >> $GITHUB_OUTPUT
          else
            echo "result=not a React project" >> $GITHUB_OUTPUT
          fi

      - name: Security audit
        id: audit
        continue-on-error: true
        run: |
          if [ -f "package-lock.json" ]; then
            RESULT=$(npm audit --json 2>/dev/null | node -e "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));const v=d.metadata?.vulnerabilities||{};console.log('critical:'+v.critical+' high:'+v.high+' moderate:'+v.moderate);}catch{console.log('audit complete')}" 2>/dev/null)
            echo "result=$RESULT" >> $GITHUB_OUTPUT
          else
            echo "result=no lockfile for audit" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const lint      = '${{ steps.lint.outputs.result }}' || 'skipped';
            const envCheck  = '${{ steps.env-check.outputs.result }}' || 'skipped';
            const unused    = `${{ steps.unused.outputs.result }}` || 'skipped';
            const rtl       = '${{ steps.rtl.outputs.result }}' || 'skipped';
            const reactDoc  = '${{ steps.react-doctor.outputs.result }}' || 'skipped';
            const audit     = '${{ steps.audit.outputs.result }}' || 'skipped';

            const icon = (val, good, warn) => {
              if (!val || val === 'skipped') return '⚪';
              if (val.includes(good)) return '✅';
              if (val.includes(warn)) return '⚠️';
              return '❌';
            };

            const rdScore = parseInt(reactDoc) || 0;
            const rdIcon = rdScore >= 75 ? '✅' : rdScore >= 60 ? '⚠️' : '❌';
            const rtlCount = parseInt(rtl) || 0;

            const body = [
              '## ⚡ GhostForge PR Quality Check',
              '',
              '| Check | Result | Status |',
              '|---|---|---|',
              `| 🔍 ESLint | ${lint} | ${lint.includes('0 errors') ? '✅' : '⚠️'} |`,
              `| 🔒 env-check | ${envCheck} | ${envCheck.includes('0') || envCheck.includes('no .env') ? '✅' : '⚠️'} |`,
              `| 🧹 Unused code | ${unused.split('\n')[0]} | ${unused.includes('No issues') ? '✅' : '⚠️'} |`,
              `| 🌐 RTL (Tailwind) | ${rtl} | ${rtlCount === 0 ? '✅' : '⚠️'} |`,
              `| ⚕️ React Doctor | ${reactDoc} | ${rdIcon} |`,
              `| 🔒 npm audit | ${audit} | ${audit.includes('critical:0') ? '✅' : '⚠️'} |`,
              '',
              '<details><summary>📖 How to fix warnings</summary>',
              '',
              '- **ESLint**: Run `npx eslint . --fix`',
              '- **env-check**: Run `bash scripts/env-check.sh --fix`',
              '- **Unused**: Run `bash scripts/unused.sh` to see details',
              '- **RTL**: Run `bash scripts/rtl.sh . --fix` to auto-fix Tailwind classes',
              '- **React Doctor**: Run `npx react-doctor@latest --verbose`',
              '- **Audit**: Run `npm audit fix`',
              '',
              '</details>',
              '',
              `*Powered by [GhostForge](https://github.com/ghostforge-copilot-business/GhostForge)*`,
            ].join('\n');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('GhostForge PR Quality Check'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
