name: 🔄 Sync Copilot Models

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  sync-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync models from Copilot API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | gh auth login --with-token
          node scripts/sync-models.js || echo "⚠️ Model sync skipped (Copilot API requires user token). Run locally: node scripts/sync-models.js"

      - name: Commit updated model files
        run: |
          git config user.name  "ghostforge-ai[bot]"
          git config user.email "ghostforge-ai[bot]@users.noreply.github.com"
          git add instructions/model-selection.md \
                  .github/copilot-instructions.md \
                  .ghostforge-models.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "chore: auto-sync Copilot model selection [skip ci]

Updated from live Copilot API — reflects current plan models.
Run: node scripts/sync-models.js to refresh locally.

Co-authored-by: ghostforge-ai[bot] <ghostforge-ai[bot]@users.noreply.github.com>"
          git push
