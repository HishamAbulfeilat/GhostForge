name: CodeQL

# CodeQL code scanning for the JavaScript/TypeScript surfaces (web-ui,
# electron-app, tui, mcp, extension, cli) and the Python bridge/voice pipeline.
#
# Public repo: results upload to the Security → Code scanning tab (free).
# Private repo: GitHub only accepts uploads with paid Code Security, so the
# scan still runs but results are kept as a SARIF artifact and summarised on
# the run page instead. Switching happens automatically from the repository's
# visibility on every run — see docs/CODE-SCANNING.md.
on:
  push:
    branches: [main, agent/integration]
  pull_request:
    branches: [main, agent/integration]
  schedule:
    - cron: '41 4 * * 2'   # weekly, picks up new CodeQL queries
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # actions: read is required for private repositories (CodeQL reads the
      # workflow run when uploading results); without it the job fails with
      # "Resource not accessible by integration".
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      # Visibility decides whether results can be uploaded. Read it from the API:
      # scheduled runs carry no repository details in their event payload.
      - name: Repository visibility
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/${{ github.repository }}" --jq .private)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Interpreted languages: no build, CodeQL extracts the sources directly.
          build-mode: none
          queries: security-extended
          # Third-party and generated code is not ours to fix; keep it out of
          # the findings so Phase 4 triage covers first-party code only.
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - vendor/**
              - web-ui/vendor/**
              - apps/worlds/*/upstream/**
              - apps/worlds/*/checkout/**
              - extension/dist/**
              - electron-app/android/**
              - electron-app/ios/**
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          # 'always' when public (free code scanning); 'never' while private or unknown
          upload: ${{ steps.repo.outputs.private == 'false' && 'always' || 'never' }}
          output: codeql-results
      - name: Summarise findings (private repo)
        if: ${{ always() && steps.repo.outputs.private != 'false' }}
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          {
            echo "### CodeQL (${{ matrix.language }})"
            if [ ${#files[@]} -eq 0 ]; then
              echo "No results file was produced."
            else
              count=$(jq '[.runs[].results[]] | length' "${files[@]}" | awk '{s+=$1} END {print s+0}')
              echo "**${count} finding(s).** The repository is private, so results are not uploaded to the Security tab."
              echo "Download the \`codeql-${{ matrix.language }}\` artifact from this run to see them (open the .sarif in VS Code with the SARIF Viewer extension)."
              echo
              jq -r '.runs[].results[] | "- \(.ruleId): \(.message.text | split("\n")[0]) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "${files[@]}" | head -50
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep results as an artifact (private repo)
        if: ${{ always() && steps.repo.outputs.private != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results/
          if-no-files-found: ignore
          retention-days: 30
