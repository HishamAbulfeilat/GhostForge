name: Deploy @ghostforge Copilot Extension

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
  workflow_dispatch:

jobs:
  deploy:
    # Only run if Vercel secrets are configured — can't use secrets in job-level if, so always run and check inside
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "⚠️  VERCEL_TOKEN secret not set — skipping deploy."
            echo "See EXTENSION_SETUP.md for setup instructions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.check-secrets.outputs.skip == 'false'
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./extension
          vercel-args: '--prod'

      - name: Show deployment URL
        if: steps.check-secrets.outputs.skip == 'false'
        run: |
          echo "### @ghostforge deployed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.vercel-deploy.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup instructions
        if: steps.check-secrets.outputs.skip == 'true'
        run: |
          echo "### @ghostforge Extension — Setup Required" >> "$GITHUB_STEP_SUMMARY"
          echo "Add these GitHub secrets to enable auto-deploy:" >> "$GITHUB_STEP_SUMMARY"
          echo "- VERCEL_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- VERCEL_ORG_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- VERCEL_PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "See EXTENSION_SETUP.md for full instructions." >> "$GITHUB_STEP_SUMMARY"
