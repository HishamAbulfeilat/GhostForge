name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win
          - linux
          - android

permissions:
  contents: write

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: electron-app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('electron-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      - name: Build TypeScript
        working-directory: electron-app
        run: npx tsc

      - name: Build Electron — macOS (x64 + arm64)
        if: matrix.platform == 'mac'
        working-directory: electron-app
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron — Windows (x64)
        if: matrix.platform == 'win'
        working-directory: electron-app
        run: npx electron-builder --win --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron — Linux (x64)
        if: matrix.platform == 'linux'
        working-directory: electron-app
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            electron-app/release/*.dmg
            electron-app/release/*.zip
            electron-app/release/*.yml
          if-no-files-found: ignore

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            electron-app/release/*.exe
            electron-app/release/*.yml
          if-no-files-found: ignore

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            electron-app/release/*.AppImage
            electron-app/release/*.deb
            electron-app/release/*.rpm
            electron-app/release/*.snap
            electron-app/release/*.yml
          if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: electron-app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('electron-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('electron-app/android/**/*.gradle*', 'electron-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Electron app dependencies
        working-directory: electron-app
        run: npm ci

      - name: Build Web UI (static export)
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Copy android-web assets
        run: cp -r electron-app/android-web/* web-ui/out/

      - name: Initialize Capacitor
        working-directory: electron-app
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: electron-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android AAB (Release)
        working-directory: electron-app/android
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            electron-app/android/app/build/outputs/apk/debug/*.apk
            electron-app/android/app/build/outputs/apk/release/*.apk
            electron-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  create-release:
    needs: [build-electron, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate source archive
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          tar czf "artifacts/ghostforge-jarvis-${TAG}-src.tar.gz" \
            --exclude='.git' \
            --exclude='electron-app/node_modules' \
            --exclude='electron-app/release' \
            --exclude='electron-app/dist' \
            --exclude='electron-app/android' \
            --exclude='web-ui/node_modules' \
            --exclude='web-ui/.next' \
            -C "$GITHUB_WORKSPACE" .
          cd "$GITHUB_WORKSPACE"
          zip -r "artifacts/ghostforge-jarvis-${TAG}-src.zip" \
            -x '.git/*' \
            'electron-app/node_modules/*' \
            'electron-app/release/*' \
            'electron-app/dist/*' \
            'electron-app/android/*' \
            'web-ui/node_modules/*' \
            'web-ui/.next/*' .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.snap
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.yml
            artifacts/ghostforge-jarvis-*-src.tar.gz
            artifacts/ghostforge-jarvis-*-src.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
