name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win
          - linux
          - android

permissions:
  contents: write

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      - name: Build TypeScript
        working-directory: electron-app
        run: npx tsc

      - name: Build Electron (${{ matrix.platform }})
        working-directory: electron-app
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            electron-app/release/*.dmg
            electron-app/release/*.zip
            electron-app/release/*.exe
            electron-app/release/*.AppImage
            electron-app/release/*.deb
            electron-app/release/*.rpm
          if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Electron app dependencies
        working-directory: electron-app
        run: npm ci

      - name: Build Web UI (static export)
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Copy android-web assets to web-ui/out
        run: |
          cp -r electron-app/android-web/* web-ui/out/

      - name: Initialize Capacitor
        working-directory: electron-app
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        working-directory: electron-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android AAB (Release)
        working-directory: electron-app/android
        run: |
          ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            electron-app/android/app/build/outputs/apk/debug/*.apk
            electron-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  create-release:
    needs: [build-electron, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
