name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.3.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # ── Source Code Archive ──────────────────────────────────────────────────────
  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archives
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          # Create source tarball
          git archive --format=tar.gz --prefix="GhostForge-${VERSION}/" -o "GhostForge-${VERSION}-source.tar.gz" HEAD

          # Create source zip
          git archive --format=zip --prefix="GhostForge-${VERSION}/" -o "GhostForge-${VERSION}-source.zip" HEAD

          ls -lh GhostForge-*-source.*

      - name: Upload source archives
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            GhostForge-*-source.tar.gz
            GhostForge-*-source.zip
          if-no-files-found: error
          retention-days: 1

  # ── macOS (Intel + Apple Silicon) ─────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript
        working-directory: electron-app
        run: npx tsc

      - name: Build Electron (macOS ${{ matrix.arch }})
        working-directory: electron-app
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            electron-app/release/*.dmg
            electron-app/release/*-mac.zip
            electron-app/release/*.blockmap
          if-no-files-found: error
          retention-days: 1

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript
        working-directory: electron-app
        run: npx tsc

      - name: Build Electron (Windows)
        working-directory: electron-app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            electron-app/release/*.exe
            electron-app/release/*.blockmap
          if-no-files-found: error
          retention-days: 1

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript
        working-directory: electron-app
        run: npx tsc

      - name: Build Electron (Linux)
        working-directory: electron-app
        run: npx electron-builder --linux --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            electron-app/release/*.AppImage
            electron-app/release/*.deb
          if-no-files-found: error
          retention-days: 1

  # ── Android ───────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets
        working-directory: electron-app
        run: |
          mkdir -p ../web-ui/out
          cp android-web/index.html ../web-ui/out/index.html

      - name: Install Capacitor
        working-directory: electron-app
        run: npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Initialize Capacitor Android
        working-directory: electron-app
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        working-directory: electron-app/android
        run: ./gradlew assembleDebug

      - name: Build Android Release APK
        working-directory: electron-app/android
        run: ./gradlew assembleRelease || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            electron-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 1

  # ── Create Release ────────────────────────────────────────────────────────
  release:
    needs: [build-source, build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List all artifacts
        run: |
          echo "=== All release files ==="
          find artifacts -type f | sort
          echo ""
          echo "=== Total size ==="
          du -sh artifacts/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Count contributors
        id: contributors
        run: |
          COUNT=$(git shortlog -sn --no-merges | wc -l | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          VERSION="${TAG#v}"

          cat > changelog.md << 'HEADER'
          ## GhostForge JARVIS v5.2.0

          The complete AI-powered development assistant — desktop app, voice assistant, screen vision, memory system, and workflow automation.

          HEADER

          # Fix leading whitespace from heredoc
          sed -i 's/^          //' changelog.md

          echo "## What's New" >> changelog.md
          echo "" >> changelog.md

          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" >> changelog.md
          else
            git log --pretty=format:"- %s (%h)" -20 >> changelog.md
          fi

          echo "" >> changelog.md
          echo "" >> changelog.md

          echo "## Features" >> changelog.md
          echo "" >> changelog.md
          echo "- **Electron Desktop App** — Cross-platform (macOS, Windows, Linux, Android)" >> changelog.md
          echo "- **Clicky Screen Vision** — Blue cursor overlay for screen capture context" >> changelog.md
          echo "- **Push-to-Talk Voice** — Ctrl+Alt+V for voice commands" >> changelog.md
          echo "- **Persistent Memory** — Remembers projects, preferences, and facts" >> changelog.md
          echo "- **Proactive Assistant** — Time-aware check-ins and break suggestions" >> changelog.md
          echo "- **Morning Briefing** — Weather, news, and daily plan" >> changelog.md
          echo "- **System Control** — Open apps, lock screen, volume, process management" >> changelog.md
          echo "- **n8n Workflow Integration** — Deploy, notify, and PR automation" >> changelog.md
          echo "- **250+ Files, 14 Agents, 70+ Commands** — Full GitHub Copilot supercharger" >> changelog.md
          echo "" >> changelog.md

          echo "## Downloads" >> changelog.md
          echo "" >> changelog.md
          echo "| Platform | Architecture | File |" >> changelog.md
          echo "|----------|-------------|------|" >> changelog.md
          echo "| macOS | Intel (x64) | \`GhostForge JARVIS-${VERSION}.dmg\` |" >> changelog.md
          echo "| macOS | Apple Silicon (arm64) | \`GhostForge JARVIS-${VERSION}-arm64.dmg\` |" >> changelog.md
          echo "| Windows | x64 | \`GhostForge JARVIS Setup ${VERSION}.exe\` (installer) |" >> changelog.md
          echo "| Windows | x64 | \`GhostForge.JARVIS.${VERSION}.exe\` (portable) |" >> changelog.md
          echo "| Linux | x64 | \`GhostForge JARVIS-${VERSION}.AppImage\` |" >> changelog.md
          echo "| Linux | x64 | \`ghostforge-jarvis_${VERSION}_amd64.deb\` |" >> changelog.md
          echo "| Android | Universal | \`app-debug.apk\` |" >> changelog.md
          echo "| Android | Universal | \`app-release-unsigned.apk\` |" >> changelog.md
          echo "| Source | All | \`GhostForge-${VERSION}-source.tar.gz\` |" >> changelog.md
          echo "| Source | All | \`GhostForge-${VERSION}-source.zip\` |" >> changelog.md
          echo "" >> changelog.md

          echo "## Quick Start" >> changelog.md
          echo "" >> changelog.md
          echo '```bash' >> changelog.md
          echo "# macOS" >> changelog.md
          echo "open 'GhostForge JARVIS-${VERSION}.dmg'" >> changelog.md
          echo "" >> changelog.md
          echo "# Windows — run the installer or portable exe" >> changelog.md
          echo '# "GhostForge JARVIS Setup '${VERSION}'.exe"' >> changelog.md
          echo "" >> changelog.md
          echo "# Linux" >> changelog.md
          echo "chmod +x 'GhostForge JARVIS-${VERSION}.AppImage' && ./'GhostForge JARVIS-${VERSION}.AppImage'" >> changelog.md
          echo "" >> changelog.md
          echo "# Linux (Debian/Ubuntu)" >> changelog.md
          echo "sudo dpkg -i 'ghostforge-jarvis_${VERSION}_amd64.deb'" >> changelog.md
          echo "" >> changelog.md
          echo "# Android" >> changelog.md
          echo "adb install app-debug.apk" >> changelog.md
          echo '```' >> changelog.md
          echo "" >> changelog.md

          echo "## Keyboard Shortcuts" >> changelog.md
          echo "" >> changelog.md
          echo "| Shortcut | Action |" >> changelog.md
          echo "|----------|--------|" >> changelog.md
          echo "| Ctrl+Alt+V | Push-to-talk voice |" >> changelog.md
          echo "| Ctrl+Alt+C | Capture screen |" >> changelog.md
          echo "| Ctrl+Alt+J | Toggle JARVIS window |" >> changelog.md
          echo "" >> changelog.md

          echo "---" >> changelog.md
          echo "" >> changelog.md
          echo "**${{ steps.contributors.outputs.count }} contributors** made this release possible." >> changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "${{ steps.tag.outputs.version }} — GhostForge JARVIS"
          body_path: changelog.md
          draft: false
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release
        run: |
          echo "=== Release Verification ==="
          gh release view ${{ steps.tag.outputs.version }} --repo ${{ github.repository }} --json tagName,isDraft,isPrerelease,publishedAt,assets | \
            jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, published: .publishedAt, assets: (.assets | length)}'
          echo ""
          echo "=== All Assets ==="
          gh release view ${{ steps.tag.outputs.version }} --repo ${{ github.repository }} --json assets | \
            jq -r '.assets[] | "\(.name) (\(.size / 1048576 * 100 | round / 100) MB)"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
