name: 🤖 Copilot PR Review

# ─────────────────────────────────────────────────────────────
# TEMPLATE WORKFLOW — copy to your project's .github/workflows/
# Skipped automatically if no root package.json exists.
# ─────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  automated-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        id: lint
        run: npm run lint 2>&1 | tee lint-output.txt || true

      - name: Run tests
        id: test
        run: npm test -- --coverage --passWithNoTests 2>&1 | tee test-output.txt || true

      - name: Run security audit
        id: audit
        run: npm audit --audit-level=high 2>&1 | tee audit-output.txt || true

      - name: Check bundle size (Next.js)
        id: bundle
        run: |
          if [ -f "next.config.js" ] || [ -f "next.config.ts" ]; then
            npm run build 2>&1 | tee build-output.txt || true
          fi

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let lintOutput = '';
            let testOutput = '';
            let auditOutput = '';
            
            try { lintOutput = fs.readFileSync('lint-output.txt', 'utf8').slice(0, 2000); } catch(e) {}
            try { testOutput = fs.readFileSync('test-output.txt', 'utf8').slice(0, 2000); } catch(e) {}
            try { auditOutput = fs.readFileSync('audit-output.txt', 'utf8').slice(0, 1000); } catch(e) {}
            
            const body = `## 🤖 Automated PR Review

            ### ✅ Checks Run
            | Check | Status |
            |-------|--------|
            | Lint | ${lintOutput.includes('error') ? '🔴 Issues found' : '✅ Passed'} |
            | Tests | ${testOutput.includes('FAIL') ? '🔴 Failing' : '✅ Passed'} |
            | Security | ${auditOutput.includes('high') || auditOutput.includes('critical') ? '🔴 Vulnerabilities found' : '✅ Clean'} |

            ${lintOutput.includes('error') ? `### 🔴 Lint Errors\n\`\`\`\n${lintOutput}\n\`\`\`` : ''}
            ${testOutput.includes('FAIL') ? `### 🔴 Test Failures\n\`\`\`\n${testOutput}\n\`\`\`` : ''}
            ${auditOutput.includes('high') ? `### 🔴 Security Vulnerabilities\n\`\`\`\n${auditOutput}\n\`\`\`` : ''}

            ---
            *Reviewed by GhostForge AI Agent — powered by GitHub Copilot*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
